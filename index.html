<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to Wear</title>
<meta name="description" content="Cycling kit for the ride's forecast.">
<meta name="theme-color" content="#EDEFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What to Wear">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #EDEFEA;
    --surface: #FFFFFF;
    --field: #F6F7F4;
    --ink: #151A17;
    --text-2: #3F4743;
    --muted: #59615C;
    --line: #CDD2CB;
    --rule: #E3E6E0;
    --dark: #151A17;
    --dark-cell: #1D2420;
    --dark-hot: #3A2A20;
    --dark-gap: #2E3632;
    --on-dark: #F2F4F0;
    --on-dark-muted: #A9B2AC;
    --accent: #E4570F;
    --accent-ink: #A03D0B;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.4 "Barlow", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .35; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  a { color: var(--text-2); }
  a:hover { color: var(--ink); }
  h1, h2 { margin: 0; font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1; }
  h1 { font-size: 26px; letter-spacing: .02em; }
  h2 { font-size: 20px; letter-spacing: .04em; }
  p { margin: 0; }

  .page {
    max-width: 1040px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4vw, 40px) max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .columns { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; }
  .column { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .strong { font-weight: 600; }
  .stack-0 { display: flex; flex-direction: column; }
  .stack-2 { display: flex; flex-direction: column; gap: 2px; }
  .stack-8 { display: flex; flex-direction: column; gap: 8px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .eyebrow.on-dark { color: var(--on-dark-muted); letter-spacing: .1em; }
  .error { color: #A3241B; }

  .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 22px;
    background: var(--surface); font-size: 14px; font-weight: 500;
    max-width: 60vw;
  }
  .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--text-2); min-height: 44px; }

  .card { background: var(--surface); border-radius: 16px; padding: 14px; }

  .search { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  .search-row { display: flex; gap: 8px; }
  input[type="search"], input[type="time"] {
    min-height: 44px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--ink); font: inherit;
  }
  input[type="search"] { flex: 1; min-width: 0; font-size: 16px; }
  input[type="time"] { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 16px; }
  input::placeholder { color: #6B736E; }
  .results { display: flex; flex-direction: column; }
  .result {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; padding: 0 4px;
    border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left;
  }

  .setup { display: flex; flex-direction: column; gap: 14px; }
  .chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .chip {
    min-height: 44px; padding: 0 4px; border-radius: 10px; font-weight: 600;
    border: 1px solid var(--line); background: var(--field);
  }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
  .sub-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .segmented { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--ground); }
  .segmented button {
    min-width: 64px; min-height: 40px; border: 0; border-radius: 9px;
    font-weight: 600; font-variant-numeric: tabular-nums; background: transparent; color: var(--text-2);
  }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(21, 26, 23, .18); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .round {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 22px; background: var(--surface);
  }
  .display { min-width: 72px; text-align: center; font: 600 24px var(--display); font-variant-numeric: tabular-nums; }

  .verdict {
    display: flex; flex-direction: column; gap: 14px;
    background: var(--dark); color: var(--on-dark); border-radius: 18px; padding: 16px;
  }
  .verdict .pill { align-self: flex-start; color: var(--ink); }
  .verdict-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .band { font: 700 34px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .cold { display: flex; flex-direction: column; align-items: flex-end; }
  .cold-value { font: 600 52px/.9 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .stats {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
    background: var(--dark-gap); border-radius: 12px; overflow: hidden;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--dark-cell); }
  .stat.hot { background: var(--dark-hot); box-shadow: inset 3px 0 0 var(--accent); }
  .stat-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-dark-muted); }
  .stat-value { font: 600 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .stat-detail { font-size: 12px; color: var(--on-dark-muted); }
  .warning { color: #FFB38A; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .wear { padding: 4px 10px; }
  .item + .item { border-top: 1px solid var(--rule); }
  .item-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 64px; padding: 8px 4px; border: 0; background: none; text-align: left;
  }
  .item-row.missing { cursor: default; }
  .thumb {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; background: #F0F2EE;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-text { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
  .badge {
    flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: #FFFFFF; background: var(--accent-ink); border-radius: 6px; padding: 3px 7px;
  }
  .chevron { flex-shrink: 0; color: var(--muted); transition: transform .15s; }
  [aria-expanded="true"] > .chevron { transform: rotate(180deg); }
  .item-panel { display: flex; flex-direction: column; gap: 6px; padding: 0 4px 12px 64px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 2px; margin-left: -7px; }
  .swatch {
    width: 44px; height: 44px; padding: 0; border: 0; background: none;
    display: flex; align-items: center; justify-content: center;
  }
  .swatch span { width: 30px; height: 30px; border-radius: 15px; border: 1px solid rgba(21, 26, 23, .25); }
  .swatch[aria-pressed="true"] span { box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--ink); }
  .photo-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .pocket {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px dashed #9AA39D; border-radius: 16px; padding: 12px 14px;
  }
  .pocket svg { flex-shrink: 0; }
  .notes { display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
  .note { display: flex; gap: 10px; font-size: 14px; color: var(--text-2); }
  .note svg { flex-shrink: 0; margin-top: 2px; }

  footer { text-align: center; padding-top: 8px; }
  footer .link { min-height: 0; }

  @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<noscript>What to Wear needs JavaScript to fetch the forecast.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
